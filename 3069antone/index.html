<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：让画布延伸到刘海屏/挖孔屏的安全区之外 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070c15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星序防线 · 2048 × 塔防</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    /* dvh：手机地址栏收放时不会把画布顶出屏幕（不支持的浏览器回落到 100%） */
    height: 100dvh;
    background: #070c15;
    color: #dbe8f7;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    /* 手机端三件套：禁长按菜单、禁文本选中、禁下拉刷新 / 橡皮筋回弹 */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(120,170,230,.18);
    /* none 而非 manipulation：游戏要吃掉全部手势，绝不能交给浏览器去滚动/缩放 */
    touch-action: none;
    cursor: pointer;
    max-width: 100vw;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    background: #070c15; z-index: 10;
    font-size: 14px; letter-spacing: .1em; color: #7d95b5;
  }
  #loading b { font-size: 22px; color: #eaf3ff; letter-spacing: .2em; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(120,170,230,.2);
    border-top-color: #6fd6ff;
    animation: sp .8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="loading"><b>星序防线</b><div class="spin"></div><span>正在生成像素美术…</span></div>

<script src="src/core/bus.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/core/loop.js"></script>
<script src="src/core/layout.js"></script>
<script src="src/art/pixel.js"></script>
<script src="src/art/plantArt.js"></script>
<script src="src/art/insectArt.js"></script>
<script src="src/art/beeArt.js"></script>
<script src="src/art/fx.js"></script>
<script src="src/systems/board2048.js"></script>
<script src="src/systems/battlefield.js"></script>
<script src="src/systems/director.js"></script>
<script src="src/view/boardView.js"></script>
<script src="src/view/battleView.js"></script>
<script src="src/systems/cards.js"></script>
<script src="src/systems/run.js"></script>
<script src="src/systems/meta.js"></script>
<script src="src/view/cardView.js"></script>
<script src="src/view/metaView.js"></script>
<!-- 编辑器导出的关卡数据（由 editor 的「下载 levels.js」生成）。缺失则游戏回落默认，行为不变。 -->
<script src="src/data/levels.js"></script>
<script src="src/main.js"></script>
</body>
</html>
